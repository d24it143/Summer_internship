################################################################################
# SecureBank Ledger — docker-compose.yaml (3 Organizations)
# Hyperledger Fabric 2.5
# Org1: BankOrg (bank.com)         3 peers | ports 7051-9051
# Org2: InsuranceOrg (insurance.com) 3 peers | ports 10051-10053
# Org3: AuditOrg (audit.com)       3 peers | ports 11051-11053
# Orderers: 3 Raft nodes           ports 7050, 8050, 9050
################################################################################

version: '3.9'

networks:
  securebank:
    name: securebank_network
    driver: bridge

volumes:
  # Orderers
  orderer0.orderer.bank.com:
  orderer1.orderer.bank.com:
  orderer2.orderer.bank.com:
  # Org1 peers
  peer0.bank.com:
  peer1.bank.com:
  peer2.bank.com:
  # Org2 peers
  peer0.insurance.com:
  peer1.insurance.com:
  peer2.insurance.com:
  # Org3 peers
  peer0.audit.com:
  peer1.audit.com:
  peer2.audit.com:
  # CouchDBs (one per peer)
  couchdb-bank0:
  couchdb-bank1:
  couchdb-bank2:
  couchdb-ins0:
  couchdb-ins1:
  couchdb-ins2:
  couchdb-aud0:
  couchdb-aud1:
  couchdb-aud2:
  # CAs
  ca.bank.com:
  ca.insurance.com:
  ca.audit.com:
  postgres_data:

# ── Shared peer base ──────────────────────────────────────────────────────────
x-peer-base: &peer-base
  image: hyperledger/fabric-peer:2.5
  environment:
    - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
    - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=securebank_network
    - FABRIC_LOGGING_SPEC=INFO
    - CORE_PEER_TLS_ENABLED=true
    - CORE_PEER_GOSSIP_USELEADERELECTION=true
    - CORE_PEER_GOSSIP_ORGLEADER=false
    - CORE_PEER_PROFILE_ENABLED=true
    - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
    - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
    - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
  working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
  command: peer node start
  volumes:
    - /var/run/docker.sock:/host/var/run/docker.sock
  networks:
    - securebank

services:
  ##############################################################################
  # Certificate Authorities (one per org)
  ##############################################################################
  ca.bank.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.bank.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.bank.com
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports:
      - "7054:7054"
      - "17054:17054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ca.bank.com:/etc/hyperledger/fabric-ca-server
      - ./organizations/fabric-ca/bankorg:/etc/hyperledger/fabric-ca-server/config
    networks:
      - securebank

  ca.insurance.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.insurance.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.insurance.com
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:18054
    ports:
      - "8054:8054"
      - "18054:18054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ca.insurance.com:/etc/hyperledger/fabric-ca-server
      - ./organizations/fabric-ca/insuranceorg:/etc/hyperledger/fabric-ca-server/config
    networks:
      - securebank

  ca.audit.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ca.audit.com
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.audit.com
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:19054
    ports:
      - "9054:9054"
      - "19054:19054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ca.audit.com:/etc/hyperledger/fabric-ca-server
      - ./organizations/fabric-ca/auditorg:/etc/hyperledger/fabric-ca-server/config
    networks:
      - securebank

  ##############################################################################
  # Orderers (Raft — shared across all orgs)
  ##############################################################################
  orderer0.orderer.bank.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer0.orderer.bank.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17050
      - ORDERER_METRICS_PROVIDER=prometheus
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/orderer.bank.com/orderers/orderer0.orderer.bank.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/orderer.bank.com/orderers/orderer0.orderer.bank.com/tls:/var/hyperledger/orderer/tls
      - orderer0.orderer.bank.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
      - "17050:17050"
    networks:
      - securebank

  orderer1.orderer.bank.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer1.orderer.bank.com
    environment:
      - ORDERER_GENERAL_LISTENPORT=8050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:8053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17051
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/orderer.bank.com/orderers/orderer1.orderer.bank.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/orderer.bank.com/orderers/orderer1.orderer.bank.com/tls:/var/hyperledger/orderer/tls
      - orderer1.orderer.bank.com:/var/hyperledger/production/orderer
    ports:
      - "8050:8050"
      - "8053:8053"
      - "17051:17051"
    networks:
      - securebank

  orderer2.orderer.bank.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer2.orderer.bank.com
    environment:
      - ORDERER_GENERAL_LISTENPORT=9050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:9053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17052
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/orderer.bank.com/orderers/orderer2.orderer.bank.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/orderer.bank.com/orderers/orderer2.orderer.bank.com/tls:/var/hyperledger/orderer/tls
      - orderer2.orderer.bank.com:/var/hyperledger/production/orderer
    ports:
      - "9050:9050"
      - "9053:9053"
      - "17052:17052"
    networks:
      - securebank

  ##############################################################################
  # CouchDB instances (9 total — one per peer)
  ##############################################################################
  # Org1 CouchDBs
  couchdb-bank0:
    image: couchdb:3.3
    container_name: couchdb-bank0
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["5984:5984"]
    volumes: [couchdb-bank0:/opt/couchdb/data]
    networks: [securebank]

  couchdb-bank1:
    image: couchdb:3.3
    container_name: couchdb-bank1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["6984:5984"]
    volumes: [couchdb-bank1:/opt/couchdb/data]
    networks: [securebank]

  couchdb-bank2:
    image: couchdb:3.3
    container_name: couchdb-bank2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["7984:5984"]
    volumes: [couchdb-bank2:/opt/couchdb/data]
    networks: [securebank]

  # Org2 CouchDBs
  couchdb-ins0:
    image: couchdb:3.3
    container_name: couchdb-ins0
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["8984:5984"]
    volumes: [couchdb-ins0:/opt/couchdb/data]
    networks: [securebank]

  couchdb-ins1:
    image: couchdb:3.3
    container_name: couchdb-ins1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["8985:5984"]
    volumes: [couchdb-ins1:/opt/couchdb/data]
    networks: [securebank]

  couchdb-ins2:
    image: couchdb:3.3
    container_name: couchdb-ins2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["8986:5984"]
    volumes: [couchdb-ins2:/opt/couchdb/data]
    networks: [securebank]

  # Org3 CouchDBs
  couchdb-aud0:
    image: couchdb:3.3
    container_name: couchdb-aud0
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["9984:5984"]
    volumes: [couchdb-aud0:/opt/couchdb/data]
    networks: [securebank]

  couchdb-aud1:
    image: couchdb:3.3
    container_name: couchdb-aud1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["9985:5984"]
    volumes: [couchdb-aud1:/opt/couchdb/data]
    networks: [securebank]

  couchdb-aud2:
    image: couchdb:3.3
    container_name: couchdb-aud2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports: ["9986:5984"]
    volumes: [couchdb-aud2:/opt/couchdb/data]
    networks: [securebank]

  ##############################################################################
  # Org1: BankOrg Peers (peer0–peer2, ports 7051/8051/9051)
  ##############################################################################
  peer0.bank.com:
    <<: *peer-base
    container_name: peer0.bank.com
    environment:
      - CORE_PEER_ID=peer0.bank.com
      - CORE_PEER_ADDRESS=peer0.bank.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bank.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.bank.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bank.com:7051
      - CORE_PEER_LOCALMSPID=BankOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb-bank0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17061
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=securebank_network
      - FABRIC_LOGGING_SPEC=INFO
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/bank.com/peers/peer0.bank.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/bank.com/peers/peer0.bank.com/tls:/etc/hyperledger/fabric/tls
      - peer0.bank.com:/var/hyperledger/production
    ports: ["7051:7051","17061:17061"]
    depends_on: [couchdb-bank0]
    networks: [securebank]

  peer1.bank.com:
    <<: *peer-base
    container_name: peer1.bank.com
    environment:
      - CORE_PEER_ID=peer1.bank.com
      - CORE_PEER_ADDRESS=peer1.bank.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer1.bank.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bank.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.bank.com:8051
      - CORE_PEER_LOCALMSPID=BankOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb-bank1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17062
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=securebank_network
      - FABRIC_LOGGING_SPEC=INFO
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/bank.com/peers/peer1.bank.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/bank.com/peers/peer1.bank.com/tls:/etc/hyperledger/fabric/tls
      - peer1.bank.com:/var/hyperledger/production
    ports: ["8051:8051","17062:17062"]
    depends_on: [couchdb-bank1]
    networks: [securebank]

  peer2.bank.com:
    <<: *peer-base
    container_name: peer2.bank.com
    environment:
      - CORE_PEER_ID=peer2.bank.com
      - CORE_PEER_ADDRESS=peer2.bank.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer2.bank.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bank.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer2.bank.com:9051
      - CORE_PEER_LOCALMSPID=BankOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb-bank2:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17063
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=securebank_network
      - FABRIC_LOGGING_SPEC=INFO
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/bank.com/peers/peer2.bank.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/bank.com/peers/peer2.bank.com/tls:/etc/hyperledger/fabric/tls
      - peer2.bank.com:/var/hyperledger/production
    ports: ["9051:9051","17063:17063"]
    depends_on: [couchdb-bank2]
    networks: [securebank]

  ##############################################################################
  # Org2: InsuranceOrg Peers (peer0–peer2, ports 10051/10052/10053)
  ##############################################################################
  peer0.insurance.com:
    <<: *peer-base
    container_name: peer0.insurance.com
    environment:
      - CORE_PEER_ID=peer0.insurance.com
      - CORE_PEER_ADDRESS=peer0.insurance.com:10051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer0.insurance.com:10055
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10055
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.insurance.com:10052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.insurance.com:10051
      - CORE_PEER_LOCALMSPID=InsuranceOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb-ins0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:17071
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=securebank_network
      - FABRIC_LOGGING_SPEC=INFO
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/insurance.com/peers/peer0.insurance.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/insurance.com/peers/peer0.insurance.com/tls:/etc/hyperledger/fabric/tls
      - peer0.insurance.com:/var/hyperledger/production
    ports: ["10051:10051","17071:17071"]
    depends_on: [couchdb-ins0]
    networks: [securebank]

  peer1.insurance.com:
    <<: *peer-base
    container_name: peer1.insurance.com
