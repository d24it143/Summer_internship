  ##############################################################################
  # CLI tool
  ##############################################################################
  cli:
    image: hyperledger/fabric-tools:2.5
    container_name: fabric_cli
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.bank.com:7051
      - CORE_PEER_LOCALMSPID=BankOrgMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/bank.com/peers/peer0.bank.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/bank.com/peers/peer0.bank.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/bank.com/peers/peer0.bank.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/bank.com/users/Admin@bank.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
    depends_on:
      - peer0.bank.com
      - peer0.insurance.com
      - peer0.audit.com
    networks: [securebank]

  ##############################################################################
  # PostgreSQL (off-chain cache)
  ##############################################################################
  postgres:
    image: postgres:16-alpine
    container_name: securebank_postgres
    environment:
      - POSTGRES_DB=securebank
      - POSTGRES_USER=securebank
      - POSTGRES_PASSWORD=securebank_secret
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [securebank]

  ##############################################################################
  # Backend API
  ##############################################################################
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: securebank_backend
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://securebank:securebank_secret@postgres:5432/securebank
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super_secret_refresh_key}
      - FABRIC_CHANNEL=banking-channel
      - FABRIC_PEER_ENDPOINT=peer0.bank.com:7051
      - FABRIC_PEER_TLS_ROOT_CERT=/fabric/organizations/peerOrganizations/bank.com/peers/peer0.bank.com/tls/ca.crt
      - FABRIC_MSP_ID=BankOrgMSP
      - FABRIC_WALLET_PATH=/fabric/wallet
      - CORS_ORIGIN=http://localhost:3000
    ports: ["4000:4000"]
    volumes:
      - ./organizations:/fabric/organizations
      - ./wallet:/fabric/wallet
    depends_on: [postgres, peer0.bank.com]
    networks: [securebank]

  ##############################################################################
  # Frontend
  ##############################################################################
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: securebank_frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [backend]
    networks: [securebank]
