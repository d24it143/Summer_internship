name: SecureBank Ledger — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/securebank

jobs:
  ##############################################################################
  # Lint & Type-check
  ##############################################################################
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend, chaincode/audit-cc, chaincode/account-cc, chaincode/transaction-cc, chaincode/loan-cc, chaincode/config-cc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.package }}/package-lock.json'
      - name: Install deps
        run: npm ci
        working-directory: ${{ matrix.package }}
      - name: Lint
        run: npm run lint --if-present
        working-directory: ${{ matrix.package }}
      - name: Type check
        run: npx tsc --noEmit
        working-directory: ${{ matrix.package }}

  ##############################################################################
  # Chaincode Unit Tests
  ##############################################################################
  test-chaincode:
    name: Chaincode Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        cc: [audit-cc, account-cc, transaction-cc, loan-cc, config-cc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci && npm test
        working-directory: chaincode/${{ matrix.cc }}

  ##############################################################################
  # Backend Integration Tests
  ##############################################################################
  test-backend:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: securebank_test
          POSTGRES_USER: securebank
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://securebank:test_password@localhost:5432/securebank_test
      JWT_SECRET: test_jwt_secret_32_characters_min!
      JWT_REFRESH_SECRET: test_refresh_secret_32_chars_min!
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: backend
      - run: npm test -- --coverage --coverageThreshold='{"global":{"lines":80}}'
        working-directory: backend

  ##############################################################################
  # Frontend Tests
  ##############################################################################
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci && npm test
        working-directory: frontend

  ##############################################################################
  # Build Docker Images
  ##############################################################################
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-chaincode]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ##############################################################################
  # Deploy to Staging (K8s)
  ##############################################################################
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
      - name: Deploy backend
        run: |
          kubectl set image deployment/securebank-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} \
            -n securebank
          kubectl rollout status deployment/securebank-backend -n securebank --timeout=300s
      - name: Deploy frontend
        run: |
          kubectl set image deployment/securebank-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }} \
            -n securebank
          kubectl rollout status deployment/securebank-frontend -n securebank --timeout=300s

  ##############################################################################
  # E2E Tests (Playwright)
  ##############################################################################
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci && npx playwright install --with-deps
        working-directory: frontend
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
