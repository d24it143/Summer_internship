################################################################################
# SecureBank Ledger — Caliper Benchmark: REGISTRATION
# Organizations: Org1 (BankOrgMSP) | Org2 (InsuranceOrgMSP) | Org3 (AuditOrgMSP)
# Transaction counts: 100, 200, 300 ... 2500 (step 100) — 25 rounds total
# Description: Account Registration — createAccount across 3 Organizations (Org1 BankOrg | Org2 InsuranceOrg | Org3 AuditOrg)
################################################################################

test:
  name: securebank-registration-benchmark
  description: >
    Account Registration — createAccount across 3 Organizations (Org1 BankOrg | Org2 InsuranceOrg | Org3 AuditOrg)
  workers:
    number: 5
  rounds:
- label: REGISTRATION_TXN_100
  description: "registration — 100 transactions across Org1 / Org2 / Org3"
  txNumber: 100
  rateControl:
    type: fixed-rate
    opts:
      tps: 50
  workload:
    module: ../workloads/registration.js
    arguments:
      roundLabel: REGISTRATION_TXN_100
