################################################################################
# SecureBank Ledger — Caliper Benchmark: TRANSFER
# Organizations: Org1 (BankOrgMSP) | Org2 (InsuranceOrgMSP) | Org3 (AuditOrgMSP)
# Transaction counts: 100, 200, 300 ... 2500 (step 100) — 25 rounds total
# Description: Cross-Org Fund Transfer — Org1→Org2, Org2→Org3, Org3→Org1 round-robin
################################################################################

test:
  name: securebank-transfer-benchmark
  description: >
    Cross-Org Fund Transfer — Org1→Org2, Org2→Org3, Org3→Org1 round-robin
  workers:
    number: 5
  rounds:
- label: TRANSFER_TXN_100
  description: "transfer — 100 transactions across Org1 / Org2 / Org3"
  txNumber: 100
  rateControl:
    type: fixed-rate
    opts:
      tps: 50
  workload:
    module: ../workloads/transfer.js
    arguments:
      roundLabel: TRANSFER_TXN_100
      txCount: 100
