# SecureBank Ledger — Caliper Benchmark: QUERY
# Organizations: Org1 (BankOrgMSP) | Org2 (InsuranceOrgMSP) | Org3 (AuditOrgMSP)
# Transaction counts: 100, 200, 300 ... 2500 (step 100) — 25 rounds total
# Description: Account Query — getAccount & getAccountsByCustomer (read-only evaluate) across 3 Organizations
################################################################################

test:
  name: securebank-query-benchmark
  description: >
    Account Query — getAccount & getAccountsByCustomer (read-only evaluate) across 3 Organizations
  workers:
    number: 5
  rounds:
